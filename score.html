
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score | AWG / ARCHIVE</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e9e9e9;
  color: #222;
  font-family: Arial, sans-serif;
}

header {
  background: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header a {
  color: inherit;
  text-decoration: none;
  font-size: 12px;
}

h1 {
  font-size: 15px;
  margin: 0;
}

#composer {
  font-size: 12px;
  color: #777;
}

.toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #fff;
  flex-wrap: wrap;
}

button {
  background: white;
  border: 1px solid #ccc;
  padding: 9px 13px;
  cursor: pointer;
  border-radius: 4px;
  color: #222;
}

#viewer {
  height: calc(100dvh - 125px);
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12px;
}

canvas {
  display: block;
  max-width: none;
  background: white;
  box-shadow: 0 2px 12px #0002;
}

#viewer:fullscreen {
  height: 100dvh;
  background: #e9e9e9;
}

@media (max-width: 600px) {
  header { padding: 10px; }
  h1 { font-size: 13px; }
  #viewer { height: calc(100dvh - 145px); }
}
</style>
</head>
<body>

<header>
  <a href="index.html#piano">← AWG / ARCHIVE</a>
  <div>
    <h1 id="title">Loading score...</h1>
    <div id="composer"></div>
  </div>
</header>

<div class="toolbar">
  <button id="prev">←</button>
  <span id="pageInfo">— / —</span>
  <button id="next">→</button>
  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>
  <button id="fullscreen">⛶</button>
</div>

<div id="viewer">
  <canvas id="scoreCanvas"></canvas>
</div>

<script type="module">
import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const scores = {
  "P-001": {
    title: "Doctor Gradus ad Parnassum",
    composer: "Claude Debussy",
    file: "files/scores/doctor-gradus.pdf"
  }
};

const params = new URLSearchParams(location.search);
const id = params.get("id");
const score = scores[id];

const canvas = document.getElementById("scoreCanvas");
const ctx = canvas.getContext("2d");
const viewer = document.getElementById("viewer");

let pdf = null;
let pageNumber = 1;
let zoom = 1;
let renderTask = null;

async function renderPage() {
  if (!pdf) return;

  if (renderTask) {
    renderTask.cancel();
    try { await renderTask.promise; } catch (e) {}
  }

  const page = await pdf.getPage(pageNumber);
  const base = page.getViewport({ scale: 1 });
  const availableWidth = Math.max(100, viewer.clientWidth - 24);
  const scale = (availableWidth / base.width) * zoom;
  const viewport = page.getViewport({ scale });

  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(viewport.width * pixelRatio);
  canvas.height = Math.floor(viewport.height * pixelRatio);
  canvas.style.width = viewport.width + "px";
  canvas.style.height = viewport.height + "px";

  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  renderTask = page.render({
    canvasContext: ctx,
    viewport
  });

  try {
    await renderTask.promise;
  } catch (e) {
    if (e.name !== "RenderingCancelledException") {
      console.error(e);
    }
  }

  document.getElementById("pageInfo").textContent =
    pageNumber + " / " + pdf.numPages;

  viewer.scrollTop = 0;
  viewer.scrollLeft = 0;
}

async function changePage(delta) {
  if (!pdf) return;
  const next = pageNumber + delta;
  if (next < 1 || next > pdf.numPages) return;
  pageNumber = next;
  await renderPage();
}

document.getElementById("prev").onclick =
  () => changePage(-1);

document.getElementById("next").onclick =
  () => changePage(1);

document.getElementById("zoomIn").onclick = async () => {
  zoom = Math.min(3, zoom + 0.2);
  await renderPage();
};

document.getElementById("zoomOut").onclick = async () => {
  zoom = Math.max(0.5, zoom - 0.2);
  await renderPage();
};

document.getElementById("fullscreen").onclick = async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
  } else if (viewer.requestFullscreen) {
    await viewer.requestFullscreen();
  }
};

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") changePage(1);
  if (e.key === "ArrowLeft") changePage(-1);
});

let touchStartX = 0;

viewer.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

viewer.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 80) {
    changePage(dx < 0 ? 1 : -1);
  }
}, { passive: true });

async function init() {
  if (!score) {
    document.getElementById("title").textContent =
      "Score not found";
    return;
  }

  document.getElementById("title").textContent = score.title;
  document.getElementById("composer").textContent = score.composer;

  try {
    pdf = await pdfjsLib.getDocument(score.file).promise;
    await renderPage();
  } catch (error) {
    document.getElementById("title").textContent =
      "Unable to load score";
    console.error(error);
  }
}

document.addEventListener("fullscreenchange", renderPage);
window.addEventListener("resize", renderPage);

init();
</script>
</body>
</html>
